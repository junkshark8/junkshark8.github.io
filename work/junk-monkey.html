<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Junk Monkey</title>
        <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
        <link href="../style.css" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- script for reusable navbar component -->
        <script src="../components/navbar.js" type="text/javascript" defer></script>
        <!-- script for reusable footer component -->
        <script src="../components/footer.js" type="text/javascript" defer></script>
        <!-- script for the hamburger menu -->
        <script>
            function collapseMenu() {
                var x = document.getElementById("topnav");
                if (x.className === "topnav") {
                    x.className += " responsive";
                    document.getElementById("bars").src="../images/xmark.svg";
                } else {
                    x.className = "topnav";
                    document.getElementById("bars").src="../images/bars.svg";
                }
            }
        </script>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                function variableContentMargin() {
                var banner = document.getElementById("banner");
                var content = document.getElementById("content");
                var contentMargin = banner.offsetHeight + 55
                console.log(contentMargin);
                content.style.marginTop = `${contentMargin}px`;
            }
            variableContentMargin();
            });
        </script>

    </head>
    <body>
        <div id="wrapper">
            <section id="banner" class="banner-image">
                <div class="hero-text">
                    <h1 id="hero-text">k8</h1>
                    <p id="hero-subtitle" class="subtitle">artist & graphic designer</p>
                </div>
            </section>

            <!-- nav bar -->
            <navbar-component class="nav-home"></navbar-component>

            <section class="hero-image gigs">
            </section>

            <!-- main content -->
            <section id="content" class="content">
                <h2 class="light">Junk Monkey</h2>

                <div class="content-container">
                    <p>Logo design for Junk Monkey production company.</p>
                    <img class="image" src="../images/work/junk-monkey/embossed-logo-mockup.webp" 
                    alt="Black and white logo embossed on paper.">
                    <img class="image" src="../images/work/junk-monkey/Junk Monkey_logo.webp" 
                    alt="Illustrated logo of a Monkey head made out of rusty car parts. The words 'Junk Monkey' are in a 
                    distressed font under the illustration.">
                    <img class="image" src="../images/work/junk-monkey/mockup.webp" 
                    alt="Mockup of the logo on a grey baseball cap with a black bill. Instead of across the bottom, the text arcs across the top 
                    of the Monkey head.">
                </div>
            </section> 
            
            <!-- footer -->
            <section id="footer">
                <footer-component></footer-component>
            </section>
        </div>
    </body>
</html>
