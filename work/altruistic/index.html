<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Altruistic</title>
        <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
        <link href="../../style.css" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- script for reusable navbar component -->
        <script src="../components/navbar.js" type="text/javascript" defer></script>
        <!-- script for reusable footer component -->
        <script src="../components/footer.js" type="text/javascript" defer></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                function variableContentMargin() {
                var banner = document.getElementById("banner");
                var content = document.getElementById("content");
                var contentMargin = banner.offsetHeight + 55
                console.log(contentMargin);
                content.style.marginTop = `${contentMargin}px`;
            }
            variableContentMargin();
            });
        </script>

    </head>
    <body>
        <div id="wrapper">
            <section id="banner" class="banner-image">
                <div class="hero-text">
                    <h1 id="hero-text">k8</h1>
                    <p id="hero-subtitle" class="subtitle">artist & graphic designer</p>
                </div>
            </section>

            <!-- nav bar -->
            <navbar-component class="nav-home"></navbar-component>

            <section class="hero-image gigs">
            </section>

            <!-- main content -->
            <section id="content" class="content">
                <h2 class="light">Altruistic</h2>

                <div class="content-container">
                    <p>Brand identity for Altruistic consulting.</p>
                    <img class="image" src="../images/work/altruistic/card-mockup.webp" 
                    alt="Mockup of the logo and wordmark on a business card.">
                    <img class="image" src="../images/work/altruistic/combomark-bw.webp" 
                    alt="Black and white version of the logo and wordmark. The logo is a circle with a triangle in the middle representing an abstracted scale of justice.">
                    <img class="image" src="../images/work/altruistic/icon-pin-mockup.webp" 
                    alt="Mockup of the icon on circular pins.">
                </div>
            </section> 
            
            <!-- footer -->
            <section id="footer">
                <footer-component></footer-component>
            </section>
        </div>
    </body>
</html>
