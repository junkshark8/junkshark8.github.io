<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Collection 1</title>
        <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
        <link href="../style.css" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- script for reusable navbar component -->
        <script src="../components/navbar.js" type="text/javascript" defer></script>
        <!-- script for reusable footer component -->
        <script src="../components/footer.js" type="text/javascript" defer></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                function variableContentMargin() {
                var banner = document.getElementById("banner");
                var content = document.getElementById("content");
                var contentMargin = banner.offsetHeight + 55
                console.log(contentMargin);
                content.style.marginTop = `${contentMargin}px`;
            }
            variableContentMargin();
            });
        </script>

    </head>
    <body>
        <div id="wrapper">
            <section id="banner" class="banner-image">
                <div class="hero-text">
                    <h1 id="hero-text">k8</h1>
                    <p id="hero-subtitle" class="subtitle">artist & graphic designer</p>
                </div>
            </section>

            <!-- nav bar -->
            <navbar-component class="nav-home"></navbar-component>

            <section class="hero-image off-the-clock">
            </section>

            <!-- main content -->
            <section id="content" class="content">
                <h2 class="light">Collection 1</h2>
                <div class="content-container">
                    <p>Glue some garbage on a board call that art</p>
                    <div class="double-image">
                        <img class="image" src="../images/play/collection-1/1.webp" 
                        alt="Left angle view of a three-dimensional collage on a painted board. It's made of miscellaneous 
                        trash, including strings of beads, plastic, and a circus cutout from a children's book.">
                        <img class="image" src="../images/play/collection-1/2.webp" 
                        alt="Right angle view of a three-dimensional collage on a painted board. It's made of miscellaneous 
                        trash, including strings of beads, plastic, and a circus cutout from a children's book.">
                    </div>
                    <img class="image" src="../images/play/collection-1/3.webp" 
                    alt="Front view of a three-dimensional collage on a painted board. It's made of miscellaneous 
                    trash, including strings of beads, plastic, and a circus cutout from a children's book.">
                    <div class="double-image">
                        <img class="image" src="../images/play/collection-1/4.webp" 
                        alt="Close up of a mass of strung beads and plastic">
                        <img class="image" src="../images/play/collection-1/5.webp" 
                        alt="Close up of tangled fishing line hanging in front of pink irridescent plastic.">
                    </div>
                    <p class="date">December 2021, Showed in <a href="identity-as-anonymity.html">Identity as Anonymity</a>, July 2022</p>
                </div>
            </section> 

            <!-- footer -->
            <section id="footer">
                <footer-component></footer-component>
            </section>
        </div>
    </body>
</html>
