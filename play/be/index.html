<!DOCTYPE html>
<html lang="en">
    <head>
        <title>"Be"</title>
        <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
        <link href="../../style.css" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- script for reusable navbar component -->
        <script src="../../components/navbar.js" type="text/javascript" defer></script>
        <!-- script for reusable footer component -->
        <script src="../../components/footer.js" type="text/javascript" defer></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                function variableContentMargin() {
                var banner = document.getElementById("banner");
                var content = document.getElementById("content");
                var contentMargin = banner.offsetHeight + 55
                console.log(contentMargin);
                content.style.marginTop = `${contentMargin}px`;
            }
            variableContentMargin();
            });
        </script>

    </head>
    <body>
        <div id="wrapper">
            <section id="banner" class="banner-image">
                <div class="hero-text">
                    <h1 id="hero-text">k8</h1>
                    <p id="hero-subtitle" class="subtitle">artist & graphic designer</p>
                </div>
            </section>

            <!-- nav bar -->
            <navbar-component class="nav-home"></navbar-component>

            <section class="hero-image off-the-clock">
            </section>

            <!-- main content -->
            <section id="content" class="content">
                <h2 class="light">"Be"</h2>
                <div class="content-container">
                    <img class="image" src="../../images/play/be/zines.webp" 
                    alt="A folded zine sitting on a fanned out stack of other folded zines.">
                    <div class="p-container">
                        <p>Be WEIRD & WILD BE Queer, Uncommon, Wicked!</p>
                    </div>
                    <img class="image" src="../../images/play/be/2.webp" 
                    alt="Zine spread made of collaged images and text cut out of magazines.">
                    <div class="p-container">
                        <p>Be GROSS IN PUBLIC BE SEEN. GET HIGH GEt A NEW TATTOO</p>
                    </div>
                    <img class="image" src="../../images/play/be/3.webp"
                    alt="Zine spread made of collaged images and text cut out of magazines.">
                    <div class="p-container">
                        <p>MAKE ART & LOVE & WAVES</p>
                    </div>
                    <img class="image" src="../../images/play/be/4.webp" 
                    alt="Zine spread made of collaged images and text cut out of magazines.">
                    <img class="image" src="../../images/play/be/1.webp" 
                    alt="Front and back cover of the zine made of collaged images and text cut out of magazines.">
                    <div class="p-container">
                        <p class="blurb"><a href="../../zines/be.zip" download>Download a printable copy of the zine</a></p>
                        <p class="date">Created during the zine workshop for <a href="../identity-as-anonymity">Identity as Anonymity</a>, July 2022</p>
                    </div>
                    
                </div>
            </section> 

            <!-- footer -->
            <section id="footer">
                <footer-component></footer-component>
            </section>
        </div>
    </body>
</html>
